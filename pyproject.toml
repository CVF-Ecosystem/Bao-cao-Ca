# Ứng dụng nhắm Python3.9+; nhập Excel cần requirements.txt (openpyxl/defusedxml/et-xmlfile).
# Cài bằng pip --require-hashes --only-binary=:all: -r requirements.txt trong môi trường riêng.
# Đóng gói Windows: Python>=3.10 và requirements-build.txt; builder không tự cài thư viện.
# Cấu hình này dành cho máy phát triển có cài ruff:  ruff check .
# Nếu chưa cài ruff, KIEM_THU_MA_NGUON.py đã kiểm tra cú pháp và import thừa bằng thư viện chuẩn.

[tool.ruff]
line-length = 160
target-version = "py39"
extend-exclude = ["DU_LIEU", "DANH_MUC"]

[tool.ruff.lint]
# E9: lỗi cú pháp/runtime; F: pyflakes (import thừa, tên chưa định nghĩa...).
select = ["E9", "F"]
